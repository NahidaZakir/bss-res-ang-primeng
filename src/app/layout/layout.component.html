<div class="flex">
  <div class="navbar-container w-[256px] bg-white z-5000">
    <app-navbar></app-navbar>
  </div>
  <div class="flex flex-col w-full">
    <div
      class="flex justify-between items-center red-bg topbar-height topbar-shadow sticky top-0 z-5000"
    >
      <div class="logo-container flex items-center">
        <img class="w-[50px] h-[50px]" src="/logo.png" alt="" />
        <div>
          <h1 class="rest-name-layout rest-name-size">BSS RESTAURANT</h1>
        </div>
      </div>

      <div class="flex h-full">
        <div class="flex justify-between items-center">
          <div
            class="username-container bg-red-800 h-full flex justify-center items-center"
          >
            <div class="flex justify-center items-center h-full px-[36px]">
              <h1 class="text-white">
                {{ userFullName() }}
              </h1>
            </div>
          </div>

          <div class="flex h-full">
            <div class="">
              <div class="flex h-full">
                <div
                  class="flex flex-col items-center justify-center px-[36px] h-full"
                >
                  @if(foodCart>0){
                  <div
                    class="w-[15px] h-[15px] ml-[6px] font-bold text-[12px] rounded-full bg-white"
                  >
                    <p class="flex justify-center items-center">
                      {{ foodCart }}
                    </p>
                  </div>
                  }
                  <i
                    class="pi pi-shopping-cart cartbtn"
                    (click)="setcartVisible()"
                  >
                  </i>
                </div>
              </div>

              <div class="card flex justify-center">
                <p-drawer
                  [(visible)]="cartDrawervisible"
                  position="right"
                  header="Cart"
                  styleClass="pt-[65px]"
                  
                >
                 
                    <app-cartfood 
                      (toShowCart)="setCartVisible($event)"
                    ></app-cartfood>
                 
                </p-drawer>
              </div>
            </div>

            <!--MenuBar logo on small devices-->
            <div class="hamburger-menu mr-[10px]">
              <div class="flex justify-center items-center h-full">
                <p-drawer [(visible)]="menudrawerVisible" [closable]="false">
                  <app-navbar (menuClicked)="closeSidebar($event)"></app-navbar>
                </p-drawer>
                <i
                  class="pi pi-bars"
                  (click)="setMenuDrawerVisible(true)"
                  style="font-size: 19px; color: white"
                ></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="z-40">
      <router-outlet></router-outlet>
    </div>

    <!-- <div class="bgimage dashboard-container ">
      <div class="outlet-container ">
        <router-outlet></router-outlet>
      </div>
    </div> -->
  </div>
</div>
